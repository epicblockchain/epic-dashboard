name: Public Release

on:
    push:
        tags:
            - '[0-9]*.[0-9]*.[0-9]*'
    repository_dispatch:
        types:
            - publish-release
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing release tag to build and publish
                required: true
                type: string

permissions:
    contents: write
    packages: read

defaults:
    run:
        shell: bash

jobs:
    prepare:
        name: Prepare Release Metadata
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.meta.outputs.version }}
            release_tag: ${{ steps.meta.outputs.release_tag }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.client_payload.release_tag || inputs.release_tag || github.ref_name }}

            - name: Derive release metadata
              id: meta
              env:
                  RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  TAG_NAME="${RELEASE_TAG}"
                  VERSION="${TAG_NAME#v}"

                  [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                    echo "Unsupported tag format: $TAG_NAME" >&2
                    exit 1
                  }

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.job_name }}
        needs: [prepare, create-release]
        runs-on: ubuntu-24.04
        container:
            image: node:22-trixie
        strategy:
            fail-fast: false
            matrix:
                include:
                    - job_name: Build Debian x64
                      make_target: deb64
                      apt_packages: fakeroot
                      rename_commands: |
                          mv out/make/deb/x64/*.deb "./epic-dashboard-${VERSION}-x64.deb"
                      upload_files: ./epic-dashboard-*-x64.deb
                    - job_name: Build Debian arm64
                      make_target: debarm64
                      apt_packages: fakeroot
                      rename_commands: |
                          mv out/make/deb/arm64/*.deb "./epic-dashboard-${VERSION}-arm64.deb"
                      upload_files: ./epic-dashboard-*-arm64.deb
                    - job_name: Build RPM x64
                      make_target: rpm64
                      apt_packages: rpm
                      build_setup: |
                          sed -i 's#usr/\* %{buildroot}/usr/#%{_topdir}/BUILD/usr/. %{buildroot}/usr/#' \
                            node_modules/electron-installer-redhat/resources/spec.ejs
                      rename_commands: |
                          mv out/make/rpm/x64/*.rpm "./epic-dashboard-${VERSION}-x64.rpm"
                      upload_files: ./epic-dashboard-*-x64.rpm
                    - job_name: Build Windows x64
                      make_target: win64
                      needs_i386: true
                      needs_wine: true
                      apt_packages: debianutils mono-devel wine wine32 wine64
                      build_setup: |
                          mkdir -p .github-home/.local/share .github-home/.wine
                          export HOME="$PWD/.github-home"
                          export XDG_DATA_HOME="$PWD/.github-home/.local/share"
                          export WINEPREFIX="$PWD/.github-home/.wine"
                      rename_commands: |
                          mv out/make/squirrel.windows/x64/*.exe "./epic-dashboard-${VERSION}-Setup-x64.exe"
                      upload_files: ./epic-dashboard-*-Setup-x64.exe
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.client_payload.release_tag || inputs.release_tag || github.ref_name }}

            - name: Mark workspace as safe for git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Install build dependencies
              env:
                  APT_PACKAGES: ${{ matrix.apt_packages }}
                  NEEDS_I386: ${{ matrix.needs_i386 }}
                  NEEDS_WINE: ${{ matrix.needs_wine }}
              run: |
                  set -euo pipefail
                  if [[ "${NEEDS_I386:-}" == "true" ]]; then
                    dpkg --add-architecture i386
                  fi

                  if [[ -n "${APT_PACKAGES:-}" ]]; then
                    apt-get update
                    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                      ${APT_PACKAGES}
                  fi

                  if [[ "${NEEDS_WINE:-}" == "true" ]]; then
                    if ! command -v wine64 >/dev/null 2>&1; then
                      ln -s "$(command -v wine)" /usr/local/bin/wine64
                    fi
                    command -v mono
                    command -v wine64
                  fi

            - name: Install App Dependencies
              run: npm ci

            - name: Verify App
              run: |
                  npm run lint
                  npm exec -- prettier --check .
                  npm test

            - name: Build App
              env:
                  BUILD_SETUP: ${{ matrix.build_setup }}
                  MAKE_TARGET: ${{ matrix.make_target }}
              run: |
                  set -euo pipefail
                  if [[ -n "${BUILD_SETUP:-}" ]]; then
                    eval "$BUILD_SETUP"
                  fi
                  make "$MAKE_TARGET"

            - name: Rename artifacts
              env:
                  RENAME_COMMANDS: ${{ matrix.rename_commands }}
              run: |
                  set -euo pipefail
                  bash -eo pipefail -c "$RENAME_COMMANDS"

            - name: Upload release assets
              uses: softprops/action-gh-release@v2
              with:
                  repository: epicblockchain/epic-dashboard
                  token: ${{ github.token }}
                  tag_name: ${{ needs.prepare.outputs.release_tag }}
                  files: ${{ matrix.upload_files }}
                  fail_on_unmatched_files: true

    build-mac:
        name: Build macOS ${{ matrix.arch }}
        needs: [prepare, create-release]
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: macos-15-intel
                      asset_arch: x64
                    - arch: arm64
                      runner: macos-15
                      asset_arch: ARM64
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            ARCH: ${{ matrix.arch }}
            ASSET_ARCH: ${{ matrix.asset_arch }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.client_payload.release_tag || inputs.release_tag || github.ref_name }}

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm

            - name: Install App Dependencies
              run: npm ci

            - name: Verify App
              run: |
                  npm run lint
                  npm exec -- prettier --check .
                  npm test

            - name: Import Developer ID certificate
              uses: apple-actions/import-codesign-certs@v7
              with:
                  p12-file-base64: ${{ secrets.MACOS_EPICDASHBOARD_DEVELOPER_ID_CERTIFICATE_BASE64 }}
                  p12-password: ${{ secrets.MACOS_EPICDASHBOARD_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

            - name: Prepare App Store Connect API key
              env:
                  APP_STORE_CONNECT_API_KEY: ${{ secrets.MACOS_EPICDASHBOARD_APPSTORE_CONNECT_API_KEY_BASE64 }}
                  APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.MACOS_EPICDASHBOARD_APPSTORE_CONNECT_API_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.MACOS_EPIC_APPSTORE_CONNECT_ISSUER_ID }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_EPIC_DEVELOPER_IDENTITY }}
              run: |
                  set -euo pipefail
                  for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_SIGNING_IDENTITY; do
                    if [[ -z "${!name}" ]]; then
                      echo "Missing required repository secret: $name" >&2
                      exit 1
                    fi
                  done
                  APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
                  printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 -D > "$APPLE_API_KEY"
                  chmod 600 "$APPLE_API_KEY"
                  echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"

            - name: Build, sign, and notarize App
              continue-on-error: true
              env:
                  APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.MACOS_EPICDASHBOARD_APPSTORE_CONNECT_API_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.MACOS_EPIC_APPSTORE_CONNECT_ISSUER_ID }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_EPIC_DEVELOPER_IDENTITY }}
              run: |
                  npm exec -- electron-forge make \
                    --targets=@electron-forge/maker-zip --platform=darwin --arch="$ARCH"

            - name: Verify signed and notarized release archive and native executable
              continue-on-error: true
              run: |
                  set -euo pipefail
                  VERIFICATION_DIR="$(mktemp -d)"
                  unzip -q out/make/zip/darwin/"$ARCH"/*.zip -d "$VERIFICATION_DIR"
                  APP_PATH="$VERIFICATION_DIR/epic-dashboard.app"
                  codesign --verify --deep --strict --verbose=2 "$APP_PATH"
                  xcrun stapler validate "$APP_PATH"
                  spctl --assess --type execute --verbose "$APP_PATH"
                  ELECTRON_RUN_AS_NODE=1 "$APP_PATH/Contents/MacOS/epic-dashboard" -e \
                    'if (process.arch !== process.env.ARCH) throw new Error("Wrong release architecture"); console.log(process.arch, process.versions.electron);'

            - name: Ensure release ZIP contains a valid notarization ticket
              if: always()
              run: |
                  set -euo pipefail
                  ZIP_DIR="out/make/zip/darwin/$ARCH"
                  ZIP_PATH="$(find "$ZIP_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit 2>/dev/null || true)"
                  if [[ -n "$ZIP_PATH" ]]; then
                    RECOVERY_DIR="$(mktemp -d)"
                    unzip -q "$ZIP_PATH" -d "$RECOVERY_DIR"
                    APP_PATH="$RECOVERY_DIR/epic-dashboard.app"
                    if xcrun stapler validate "$APP_PATH"; then
                      echo "Forge ZIP contains an app with a valid notarization ticket"
                      exit 0
                    fi

                    xcrun stapler staple "$APP_PATH"
                    xcrun stapler validate "$APP_PATH"
                    REPACKED_ZIP="$RUNNER_TEMP/epic-dashboard-darwin-$ARCH.zip"
                    ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$REPACKED_ZIP"
                    mv "$REPACKED_ZIP" "$ZIP_PATH"
                    exit 0
                  fi

                  APP_PATH="out/epic-dashboard-darwin-$ARCH/epic-dashboard.app"
                  if [[ ! -d "$APP_PATH" ]]; then
                    APP_PATH="$(find out -type d -name epic-dashboard.app -print -quit)"
                  fi
                  if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
                    echo "No packaged app bundle found; cannot recover ZIP" >&2
                    exit 1
                  fi

                  xcrun stapler staple "$APP_PATH"
                  xcrun stapler validate "$APP_PATH"
                  mkdir -p "$ZIP_DIR"
                  ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_DIR/epic-dashboard-darwin-$ARCH.zip"

            - name: Rename artifact
              run: mv out/make/zip/darwin/"$ARCH"/*.zip "./epic-dashboard-mac-${VERSION}-${ASSET_ARCH}.zip"

            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              with:
                  repository: epicblockchain/epic-dashboard
                  token: ${{ github.token }}
                  tag_name: ${{ needs.prepare.outputs.release_tag }}
                  files: ./epic-dashboard-mac-${{ needs.prepare.outputs.version }}-${{ matrix.asset_arch }}.zip
                  fail_on_unmatched_files: true

    create-release:
        name: Ensure GitHub Release Exists
        needs: prepare
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.client_payload.release_tag || inputs.release_tag || github.ref_name }}

            - name: Create or update GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  repository: epicblockchain/epic-dashboard
                  token: ${{ github.token }}
                  tag_name: ${{ needs.prepare.outputs.release_tag }}
                  name: ${{ needs.prepare.outputs.release_tag }}
                  generate_release_notes: true
                  draft: true

    publish-release:
        name: Publish GitHub Release
        needs: [prepare, build, build-mac]
        runs-on: ubuntu-24.04
        steps:
            - name: Publish draft release
              uses: softprops/action-gh-release@v2
              with:
                  repository: epicblockchain/epic-dashboard
                  token: ${{ github.token }}
                  tag_name: ${{ needs.prepare.outputs.release_tag }}
                  draft: false
